<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const API_SERVER='https://olo-chat.duckdns.org';
const S={server:API_SERVER,token:null,refreshToken:null,userId:null,username:null,chats:[],msgs:[],favorites:[],favoriteIds:new Set(),chatId:null,peerId:null,selectedMessageId:null,partner:'',avatar:'',q:'',ws:null,retry:0,hasOlder:false,loadingOlder:false,connectionStatus:'DISCONNECTED',connectionStatusVisible:true,selectedGroupUsers:new Set(),stickerPacks:[]};
let view='',wsGen=0;
let appTheme=localStorage.getItem('olo.theme')||'dark';
function applyTheme(theme){appTheme=theme==='light'?'light':'dark';document.documentElement.dataset.theme=appTheme;localStorage.setItem('olo.theme',appTheme);const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=appTheme==='light'?'#e9e5ef':'#1b1a20'}
applyTheme(appTheme);
try{Object.assign(S,JSON.parse(localStorage.getItem('olo.session')||'{}'))}catch{}
S.server=API_SERVER;

function h(t,p={},...c){const e=document.createElement(t);for(const k in p){if(k.startsWith('on'))e.addEventListener(k.slice(2),p[k]);else e.setAttribute(k,p[k])}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e}
function show(v){view=v;$('#app').replaceChildren(v==='auth'?authView():v==='list'?listView():v==='profile'?profileView():v==='favorites'?favoritesView():chatView());updateConnectionStatus()}
function navigate(v){history.pushState({oloView:v},'',location.href);show(v)}
window.addEventListener('popstate',event=>{if(!S.token){show('auth');history.replaceState({oloView:'auth'},'',location.href);return}const target=event.state?.oloView;if(target==='chat'){show('chat');loadMsgs();return}if(target==='profile'){show('profile');return}if(target==='favorites'){show('favorites');loadFavorites();return}if(view==='chat'){S.chatId=null;S.peerId=null;S.msgs=[]}if(view==='list'&&S.token){history.pushState({oloView:'list'},'',location.href);return}show('list');loadChats()});
function saveSession(){localStorage.setItem('olo.session',JSON.stringify({server:S.server,token:S.token,refreshToken:S.refreshToken,userId:S.userId,username:S.username}))}
if(S.token)saveSession();
function avatar(u){return /^data:image\//.test(u||'')?h('img',{class:'av',src:u,alt:''}):h('div',{class:'av'},'👤')}

let refreshInFlight=null;
async function refreshSession(){
  if(refreshInFlight)return refreshInFlight;
  refreshInFlight=(async()=>{
    if(!S.refreshToken)return false;
    const r=await fetch(S.server+'/api/v1/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:S.refreshToken})});
    if(!r.ok)return false;
    const d=await r.json();Object.assign(S,{token:d.token,refreshToken:d.refreshToken||S.refreshToken,userId:d.userId||S.userId,username:d.username||S.username});saveSession();return true;
  })().finally(()=>{refreshInFlight=null});
  return refreshInFlight;
}
async function api(path,opt={}){
  const send=()=>fetch(S.server+path,{...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(S.token?{Authorization:'Bearer '+S.token}:{}),...opt.headers}});
  let r=await send();
  const authEndpoint=/\/auth\/(login|register|refresh|logout)/.test(path);
  if(r.status===401&&S.token&&!authEndpoint){
    if(await refreshSession())r=await send();
    if(r.status===401){logout(false);throw new Error('expired')}
  }
  return r;
}
window.oloApi=api;

/* ---------- вход ---------- */
function authView(){
  let reg=false;
  const err=h('div',{class:'err'});
  const u=h('input',{placeholder:'Логин',autocapitalize:'off',autocomplete:'username'});
  const p=h('input',{type:'password',placeholder:'Пароль',autocomplete:'current-password'});
  const stripWhitespace=e=>{const clean=e.target.value.replace(/\s/g,'');if(clean!==e.target.value)e.target.value=clean};u.addEventListener('input',stripWhitespace);p.addEventListener('input',stripWhitespace);
  const go=h('button',{},'Войти');
  const sw=h('a',{},'Нет аккаунта? Регистрация');
  sw.onclick=()=>{reg=!reg;go.textContent=reg?'Зарегистрироваться':'Войти';sw.textContent=reg?'Есть аккаунт? Вход':'Нет аккаунта? Регистрация'};
  go.onclick=async()=>{
    err.textContent='';
    try{
      const r=await api('/api/v1/auth/'+(reg?'register':'login'),{method:'POST',body:JSON.stringify({username:u.value.trim(),password:p.value.trim()})});
      if(!r.ok){
        const j=await r.json().catch(()=>({}));
        err.textContent=r.status===409?'Этот логин уже занят':r.status===401?'Неверный логин или пароль':r.status===429?'Слишком много попыток, попробуйте позже':j.message||'Ошибка '+r.status;
        return;
      }
      const d=await r.json();
      Object.assign(S,{token:d.token,refreshToken:d.refreshToken||null,userId:d.userId,username:d.username});
      saveSession();start();
    }catch{err.textContent='Нет связи с сервером'}
  };
  return h('div',{class:'auth'},h('h1',{},'olo'),err,u,p,go,sw);
}
function start(){S.msgs=[];S.chatId=null;S.peerId=null;S.pendingChatId=new URLSearchParams(location.search).get('chat');history.replaceState({oloView:'list'},'',location.pathname);connectWS();loadChats();loadFavorites();show('list')}
async function logout(remote=true){
  if(remote&&S.token){const oldSession={server:S.server,token:S.token,refreshToken:S.refreshToken};if(window.oloDisablePush)await window.oloDisablePush(oldSession);await api('/api/v1/auth/logout',{method:'POST',body:JSON.stringify({refreshToken:S.refreshToken})}).catch(()=>{});}
  wsGen++;if(S.ws)S.ws.close();S.ws=null;
  for(const url of attachmentObjectUrls.values())URL.revokeObjectURL(url);attachmentObjectUrls.clear();
  Object.assign(S,{token:null,refreshToken:null,userId:null,chats:[],msgs:[],favorites:[],favoriteIds:new Set(),chatId:null,hasOlder:false,loadingOlder:false});
  localStorage.removeItem('olo.session');show('auth');
}

/* ---------- список чатов и поиск ---------- */
function localDayKey(date){return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`}
function formatChatTime(value){if(!value)return'';const date=new Date(value);if(Number.isNaN(date.getTime()))return'';return localDayKey(date)===localDayKey(new Date())?new Intl.DateTimeFormat([], {hour:'2-digit',minute:'2-digit'}).format(date):new Intl.DateTimeFormat([], {day:'2-digit',month:'2-digit',year:'numeric'}).format(date)}
function formatMessageDate(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return'';const now=new Date(),yesterday=new Date(now);yesterday.setDate(now.getDate()-1);if(localDayKey(date)===localDayKey(now))return'Сегодня';if(localDayKey(date)===localDayKey(yesterday))return'Вчера';return new Intl.DateTimeFormat([], {day:'numeric',month:'long',year:'numeric'}).format(date)}
function presenceLabel(online,lastSeenAt){if(online)return'В сети';if(!lastSeenAt)return'Не в сети';const d=new Date(lastSeenAt);if(Number.isNaN(d.getTime()))return'Не в сети';return'Был(а) в сети '+d.toLocaleString([],{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function chatRow(c){
  const content=c.lastMessage||'Нет сообщений';
  const groupSender=c.type==='GROUP'?c.members?.find(member=>member.userId===c.lastMessageSenderId):null;
  const sender=c.lastMessageSenderId===S.userId?'Вы':c.lastMessageSenderId?(groupSender?(groupSender.displayName?.trim()||groupSender.username).slice(0,4):(c.partnerDisplayName?.trim()?.slice(0,4)||c.partnerUsername?.trim()?.slice(0,4)||c.partnerName?.slice(0,4)||'')):'';
  const preview=sender?`${sender}: ${content}`:content;
  return h('div',{class:'row',onclick:()=>openChat(c)},avatar(c.partnerAvatarUrl),h('div',{class:'t'},h('b',{},c.partnerName||'Чат'),h('span',{class:'presence'+(c.partnerOnline?' online':'')},presenceLabel(c.partnerOnline,c.partnerLastSeenAt)),h('span',{},preview)),h('div',{class:'chat-meta'},c.lastMessageAt?h('span',{class:'chat-time'},formatChatTime(c.lastMessageAt)):null,c.unreadCount>0?h('em',{},c.unreadCount>99?'99+':String(c.unreadCount)):null))

  while(!document.querySelector(`[data-message-id="${CSS.escape(messageId)}"]`)&&S.hasOlder&&!S.loadingOlder){await loadOlderMessages();await new Promise(resolve=>setTimeout(resolve,0))}
  const target=document.querySelector(`[data-message-id="${CSS.escape(messageId)}"]`);
  if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.add('jump-target');setTimeout(()=>target.classList.remove('jump-target'),1500)}
}
function markRead(){
  if(view!=='chat'||document.hidden||!S.chatId||!S.msgs.some(m=>m.senderId!==S.userId&&m.status!=='READ'))return;
  S.msgs.forEach(m=>{if(m.senderId!==S.userId)m.status='READ'});
  api(`/api/v1/chats/${S.chatId}/read`,{method:'POST'}).then(loadChats).catch(()=>{});
}
async function loadMsgs(){
  if(!S.chatId)return;
  try{
    const r=await api(`/api/v1/chats/${S.chatId}/messages?limit=50`);if(!r.ok)return;
    const list=await r.json();S.hasOlder=list.length===50;
    const pend=S.msgs.filter(m=>m.status==='PENDING'||m.status==='FAILED');
    S.msgs=[...new Map([...S.msgs,...list,...pend].map(m=>[m.id,m])).values()].sort((a,b)=>String(a.timestamp).localeCompare(String(b.timestamp)));
    renderMsgs(true);markRead();
  }catch{}
}
async function loadOlderMessages(){
  if(!S.chatId||!S.hasOlder||S.loadingOlder)return;
  const first=S.msgs[0];if(!first)return;S.loadingOlder=true;
  const listEl=$('#msgs'),oldHeight=listEl?.scrollHeight||0,oldTop=listEl?.scrollTop||0;
  try{const r=await api(`/api/v1/chats/${S.chatId}/messages?limit=50&beforeMessageId=${encodeURIComponent(first.id)}`);if(!r.ok)return;const page=await r.json();S.hasOlder=page.length===50;S.msgs=[...new Map([...S.msgs,...page].map(m=>[m.id,m])).values()].sort((a,b)=>String(a.timestamp).localeCompare(String(b.timestamp)));renderMsgs();if(listEl)listEl.scrollTop=oldTop+(listEl.scrollHeight-oldHeight)}catch{}finally{S.loadingOlder=false}
}

async function send(text,replyToMessageId=null){
  const parts=[];const symbols=Array.from(text);for(let i=0;i<symbols.length;i+=300)parts.push(symbols.slice(i,i+300).join(''));
  for(let index=0;index<parts.length;index++){
    const content=parts[index],cid=crypto.randomUUID(),now=new Date().toISOString();
    const pending={id:cid,clientMessageId:cid,chatId:S.chatId,senderId:S.userId,content,status:'PENDING',timestamp:now};S.msgs.push(pending);renderMsgs();
    const reply=index===0?replyToMessageId:null;
    const body=S.chatId?{senderId:S.userId,content,sentAt:now,clientMessageId:cid,replyToMessageId:reply}:{targetUserId:S.peerId,content,sentAt:now,clientMessageId:cid,replyToMessageId:reply};
    try{
      const r=await api(S.chatId?`/api/v1/chats/${S.chatId}/messages`:'/api/v1/chats/direct/messages',{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw Error('HTTP '+r.status);
      const d=await r.json();S.chatId=d.chatId;S.peerId=null;S.msgs=S.msgs.filter(x=>x.id!==d.id&&x.clientMessageId!==cid);S.msgs.push(d);
    }catch{const m=S.msgs.find(x=>x.clientMessageId===cid);if(m)m.status='FAILED';break}
    renderMsgs();
  }
  renderMsgs();loadChats();
}
async function sendSticker(item){if(item.emoji){send(item.emoji);return}try{const r=await api(item.url);if(!r.ok)throw Error('download');const blob=await r.blob();await sendAttachment(new File([blob],item.fileName||'sticker.png',{type:item.contentType||blob.type||'image/png'}))}catch{alert('Не удалось отправить стикер')}}
async function showStickers(panel){panel.replaceChildren(h('b',{},'Стикеры'),h('button',{type:'button',onclick:async()=>{const name=prompt('Название набора');if(!name?.trim())return;const r=await api('/api/v1/stickers/packs',{method:'POST',body:JSON.stringify({name:name.trim()})});if(!r.ok){alert('Не удалось создать набор');return}await loadStickerPacks();showStickers(panel)}},'＋ Набор'));for(const pack of S.stickerPacks){panel.append(h('div',{class:'sticker-pack-title'},pack.name));for(const item of pack.stickers||[]){if(item.emoji){panel.append(h('button',{class:'sticker-item',onclick:()=>sendSticker(item)},item.emoji));continue}const b=h('button',{class:'sticker-item',title:item.fileName,onclick:()=>sendSticker(item)},'…');const r=await api(item.url);if(r.ok){const url=URL.createObjectURL(await r.blob());b.replaceChildren(h('img',{src:url,alt:item.fileName}))}panel.append(b)}}const upload=h('input',{type:'file',accept:'image/*'});upload.onchange=async()=>{const pack=S.stickerPacks.find(x=>!x.builtIn);const file=upload.files?.[0];if(!file)return;if(!pack){alert('Сначала создайте пользовательский набор');return}const form=new FormData();form.append('file',file);const r=await api(`/api/v1/stickers/packs/${pack.id}/stickers`,{method:'POST',body:form});if(!r.ok){alert('Не удалось загрузить стикер (лимит 2 МБ, только изображения)');return}await loadStickerPacks();showStickers(panel)};panel.append(upload)}
async function loadStickerPacks(){try{const r=await api('/api/v1/stickers/packs');if(r.ok)S.stickerPacks=await r.json()}catch{}}
async function manageGroup(){const action=prompt('1 — переименовать, 2 — добавить участника, 3 — удалить участника');if(action==='1'){const name=prompt('Новое название группы',S.partner);if(name?.trim())await api(`/api/v1/chats/${S.chatId}/group`,{method:'PUT',body:JSON.stringify({name:name.trim()})})}else if(action==='2'){const userId=prompt('ID пользователя');if(userId)await api(`/api/v1/chats/${S.chatId}/members`,{method:'POST',body:JSON.stringify({userId})})}else if(action==='3'){const userId=prompt('ID участника');if(userId)await api(`/api/v1/chats/${S.chatId}/members/${encodeURIComponent(userId)}`,{method:'DELETE'})}await loadChats()}
function chatView(){
  const inp=h('textarea',{rows:'1',placeholder:'Сообщение',maxlength:'10000'});
  const imageInput=h('input',{type:'file',accept:'image/*',class:'avatar-input'}),videoInput=h('input',{type:'file',accept:'video/*',class:'avatar-input'}),fileInput=h('input',{type:'file',class:'avatar-input'});
  for(const input of [imageInput,videoInput,fileInput])input.onchange=()=>{const file=input.files?.[0];if(file)sendAttachment(file);input.value=''};
  const stickerPanel=h('div',{class:'sticker-panel'});stickerPanel.hidden=true;const stickerButton=h('button',{type:'button',onclick:async()=>{stickerPanel.hidden=!stickerPanel.hidden;if(!stickerPanel.hidden){await loadStickerPacks();showStickers(stickerPanel)}}},'☺ Стикеры');
  const attachments=h('div',{class:'attachment-toolbar'},h('button',{type:'button',onclick:()=>imageInput.click()},'▧  Фото'),h('button',{type:'button',onclick:()=>videoInput.click()},'▶  Видео'),h('button',{type:'button',onclick:()=>fileInput.click()},'＋  Файл'),stickerButton);
  const count=h('small',{class:'chat-time'},'0 знаков · 0 сообщений');inp.oninput=()=>{const n=Array.from(inp.value).length;count.textContent=n.toLocaleString('ru-RU')+' знаков · '+(n?Math.ceil(n/300):0)+' сообщений'};
  const reply=S.replyTo?h('div',{class:'reply-preview'},'Ответ: '+S.replyTo.content.slice(0,70)+' ',h('button',{onclick:()=>{S.replyTo=null;show('chat')}},'×')):null;
  const go=()=>{const t=inp.value.trim();if(t){inp.value='';send(t,S.replyTo?.id);S.replyTo=null;document.querySelector('.reply-preview')?.remove()}};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|iPhone|Android/.test(navigator.userAgent)){e.preventDefault();go()}};
  setTimeout(()=>{renderMsgs();const list=$('#msgs');if(list)list.onscroll=()=>{if(list.scrollTop<100)loadOlderMessages()};},0);
  return h('div',{class:'col'},
    h('header',{class:'chat-header'},h('b',{},'olo'),h('div',{class:'chat-header-person'},h('button',{class:'back','aria-label':'Назад',onclick:()=>history.back()},'‹'),(()=>{const a=avatar(S.avatar);if(S.partnerUserId){a.title='Открыть профиль';a.onclick=()=>viewUserProfile(S.partnerUserId)}return a})(),h('div',{},h('b',{},S.partner),h('div',{id:'partner-presence',class:'presence'+(S.partnerOnline?' online':'')},presenceLabel(S.partnerOnline,S.partnerLastSeenAt))),S.chatType==='GROUP'?h('button',{type:'button',onclick:manageGroup},'Участники'):null)),
    h('div',{id:'connection-status',class:'connection-status'}),
    h('div',{class:'msgs',id:'msgs'}),stickerPanel,
    h('footer',{},h('div',{class:'t'},attachments,imageInput,videoInput,fileInput,reply,inp,count),h('button',{'aria-label':'Отправить',onclick:go},'Отправить')));
}

/* ---------- WebSocket ---------- */
function closeWS(){wsGen++;if(S.ws)S.ws.close();S.ws=null}
async function connectWS(){
  closeWS();if(!S.token)return;
  S.connectionStatus=S.retry?'RECONNECTING':'CONNECTING';S.connectionStatusVisible=true;updateConnectionStatus();
  const id=wsGen;
  try{
    const r=await api('/api/v1/ws-ticket',{method:'POST'});if(!r.ok)throw 0;
    const {ticket}=await r.json();if(id!==wsGen)return;
    const ws=new WebSocket(S.server.replace(/^http/,'ws')+'/ws?ticket='+encodeURIComponent(ticket));S.ws=ws;
    ws.onopen=()=>{S.retry=0;S.connectionStatus='CONNECTED';S.connectionStatusVisible=true;updateConnectionStatus();loadChats();loadMsgs();setTimeout(()=>{if(S.ws===ws&&S.connectionStatus==='CONNECTED'){S.connectionStatusVisible=false;updateConnectionStatus()}},2200)};
    ws.onmessage=e=>{try{onEvent(JSON.parse(e.data))}catch{}};
    ws.onerror=()=>{if(id===wsGen){S.connectionStatus='ERROR';updateConnectionStatus()}};
    ws.onclose=()=>{if(id===wsGen){S.connectionStatus='RECONNECTING';updateConnectionStatus();retry()}};
  }catch{if(id===wsGen){S.connectionStatus='ERROR';updateConnectionStatus();retry()}}
}
function retry(){S.connectionStatus='RECONNECTING';S.connectionStatusVisible=true;updateConnectionStatus();setTimeout(connectWS,Math.min(30000,1000*2**S.retry++))}
function updateConnectionStatus(){
  const el=$('#connection-status');if(!el)return;
  const states={CONNECTING:['Подключаемся к серверу…','reconnecting'],CONNECTED:['Подключено','connected'],RECONNECTING:['Связь прервалась, переподключаемся…','reconnecting'],ERROR:['Ошибка соединения','error'],DISCONNECTED:['Нет соединения','error']};
  const [label,style]=states[S.connectionStatus]||states.DISCONNECTED;el.textContent='●  '+label;el.className='connection-status '+style;el.hidden=S.connectionStatus==='CONNECTED'&&!S.connectionStatusVisible;
}
function onEvent(e){
  if(e.type==='NEW_MESSAGE'){
    if(!S.chatId&&S.peerId&&e.senderId===S.peerId){S.chatId=e.chatId;S.peerId=null}
    if(e.chatId===S.chatId&&view==='chat'&&!S.msgs.some(m=>m.id===e.id||(e.clientMessageId&&m.clientMessageId===e.clientMessageId))){
      S.msgs.push(e);renderMsgs();markRead();
    }
    loadChats();
  }else if(e.type==='MESSAGE_STATUS'&&e.chatId===S.chatId){
    const m=S.msgs.find(x=>x.id===e.id);if(m){m.status=e.status;renderMsgs()}
  }else if(e.type==='EDIT_MESSAGE'){
    if(e.chatId===S.chatId){S.msgs=S.msgs.map(m=>m.id===e.id?{...m,content:e.content||'',editedAt:e.editedAt}:m);renderMsgs()}
    loadChats()
  }else if(e.type==='DELETE_MESSAGE'||e.type==='DELETE_FOR_ME'){
    if(e.chatId===S.chatId){S.msgs=S.msgs.filter(m=>m.id!==e.id);renderMsgs()}
    loadChats()
  }else if(e.type==='PRESENCE'){
    S.chats=S.chats.map(c=>c.partnerUserId===e.userId?{...c,partnerOnline:e.online,partnerLastSeenAt:e.lastSeenAt}:c);
    S.searchResults=(S.searchResults||[]).map(u=>u.id===e.userId?{...u,online:e.online,lastSeenAt:e.lastSeenAt}:u);
    if(S.partnerUserId===e.userId){S.partnerOnline=e.online;S.partnerLastSeenAt=e.lastSeenAt;const el=$('#partner-presence');if(el){el.textContent=presenceLabel(e.online,e.lastSeenAt);el.className='presence'+(e.online?' online':'')}}
    if(view==='list'){renderChats()}
    document.querySelector(`[data-user-id="${CSS.escape(e.userId||'')}"] .presence`)?.replaceChildren(presenceLabel(e.online,e.lastSeenAt));
    const statusRow=document.querySelector(`[data-user-id="${CSS.escape(e.userId||'')}"] .presence`);if(statusRow)statusRow.className='presence'+(e.online?' online':'');
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!S.token)return;
  if(!S.ws||S.ws.readyState>1)connectWS();else{loadChats();loadMsgs()}
});
window.addEventListener('offline',()=>{S.connectionStatus='ERROR';updateConnectionStatus()});
window.addEventListener('online',()=>{if(S.token)connectWS()});

function updateViewportHeight(){if(window.visualViewport){document.documentElement.style.setProperty('--app-height',window.visualViewport.height+'px');document.body.classList.toggle('keyboard-open',window.visualViewport.height<window.innerHeight-140)}}
updateViewportHeight();window.visualViewport?.addEventListener('resize',updateViewportHeight);window.addEventListener('orientationchange',()=>setTimeout(updateViewportHeight,150));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('olo-open-chat',event=>{const id=event.detail.chatId,c=S.chats.find(x=>x.id===id);if(c)openChat(c);else{S.pendingChatId=id;loadChats()}});
if(S.token)start();else{history.replaceState({oloView:'auth'},'',location.href);show('auth')}
</script>
