;padding:24px}.msgs{flex:1;min-height:0;overflow:auto;padding:12px 16px;display:flex;flex-direction:column}.message-stack{margin-top:auto;display:flex;flex-direction:column;gap:8px}.message-date{align-self:center;margin:10px 0;padding:5px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--mut);font-size:12px}.m{max-width:80%;padding:10px 12px;border:1px solid var(--line);border-radius:5px 5px 5px 1px;background:var(--them);color:var(--text);white-space:pre-wrap;word-break:break-word;align-self:flex-start}.m.me{background:var(--me);color:var(--me-text);border-radius:5px 5px 1px 5px;align-self:flex-end}.m small{display:block;text-align:right;font-size:10px;color:var(--mut)}i{font-style:normal}.rd{color:var(--accent)}footer{display:flex;gap:8px;padding:10px 12px;align-items:flex-end;background:var(--bg)}footer textarea{resize:none;max-height:120px}.back{padding:6px 14px;font-size:20px}.avatar-input{display:none}.profile-preview{display:flex;justify-content:center;margin:8px 0}.profile-preview .av{width:96px;height:96px;font-size:28px}.app-header{min-height:56px;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line)}.chat-header{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--card);padding:12px 16px}.chat-header-person{display:flex;align-items:center;gap:12px;min-height:40px}.chat-header-person b{font-weight:600}.bottom-bar{height:60px;min-height:60px;display:flex;align-items:center;justify-content:space-around;background:var(--nav);border-top:1px solid var(--line);margin:0 calc(-1 * env(safe-area-inset-right)) calc(-1 * env(safe-area-inset-bottom)) calc(-1 * env(safe-area-inset-left));padding:0 8px env(safe-area-inset-bottom)}.bottom-bar button{width:50%;height:60px;border-radius:0;background:transparent;color:var(--mut);font-size:24px;display:flex;align-items:center;justify-content:center}.bottom-bar button:active{background:var(--surface2)}.nav-label{position:absolute;width:1px;h <body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const API_SERVER='https://olo-chat.duckdns.org';
const S={server:API_SERVER,token:null,refreshToken:null,userId:null,username:null,chats:[],msgs:[],chatId:null,peerId:null,partner:'',avatar:'',q:'',ws:null,retry:0,hasOlder:false,loadingOlder:false,connectionStatus:'DISCONNECTED',connectionStatusVisible:true};
let view='',wsGen=0;
let appTheme=localStorage.getItem('olo.theme')||'dark';
function applyTheme(theme){appTheme=theme==='light'?'light':'dark';document.documentElement.dataset.theme=appTheme;localStorage.setItem('olo.theme',appTheme);const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=appTheme==='light'?'#e9e5ef':'#1b1a20'}
applyTheme(appTheme);
try{Object.assign(S,JSON.parse(localStorage.getItem('olo.session')||'{}'))}catch{}
S.server=API_SERVER;

function h(t,p={},...c){const e=document.createElement(t);for(const k in p){if(k.startsWith('on'))e.addEventListener(k.slice(2),p[k]);else e.setAttribute(k,p[k])}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e}
function show(v){view=v;$('#app').replaceChildren(v==='auth'?authView():v==='list'?listView():v==='profile'?profileView():chatView());updateConnectionStatus()}
function navigate(v){history.pushState({oloView:v},'',location.href);show(v)}
window.addEventListener('popstate',event=>{if(!S.token){show('auth');history.replaceState({oloView:'auth'},'',location.href);return}const target=event.state?.oloView;if(target==='chat'){show('chat');loadMsgs();return}if(target==='profile'){show('profile');return}if(view==='chat'){S.chatId=null;S.peerId=null;S.msgs=[]}if(view==='list'&&S.token){history.pushState({oloView:'list'},'',location.href);return}show('list');loadChats()});
function saveSession(){localStorage.setItem('olo.session',JSON.stringify({server:S.server,token:S.token,refreshToken:S.refreshToken,userId:S.userId,username:S.username}))}
if(S.token)saveSession();
function avatar(u){return /^data:image\//.test(u||'')?h('img',{class:'av',src:u,alt:''}):h('div',{class:'av'},'👤')}

let refreshInFlight=null;
async function refreshSession(){
  if(refreshInFlight)return refreshInFlight;
  refreshInFlight=(async()=>{
    if(!S.refreshToken)return false;
    const r=await fetch(S.server+'/api/v1/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:S.refreshToken})});
    if(!r.ok)return false;
    const d=await r.json();Object.assign(S,{token:d.token,refreshToken:d.refreshToken||S.refreshToken,userId:d.userId||S.userId,username:d.username||S.username});saveSession();return true;
  })().finally(()=>{refreshInFlight=null});
  return refreshInFlight;
}
async function api(path,opt={}){
  const send=()=>fetch(S.server+path,{...opt,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{}),...opt.headers}});
  let r=await send();
  const authEndpoint=/\/auth\/(login|register|refresh|logout)/.test(path);
  if(r.status===401&&S.token&&!authEndpoint){
    if(await refreshSession())r=await send();
    if(r.status===401){logout(false);throw new Error('expired')}
  }
  return r;
}
window.oloApi=api;

/* ---------- вход ---------- */
function authView(){
  let reg=false;
  const err=h('div',{class:'err'});
  const u=h('input',{placeholder:'Логин',autocapitalize:'off',autocomplete:'username'});
  const p=h('input',{type:'password',placeholder:'Пароль',autocomplete:'current-password'});
  const stripWhitespace=e=>{const clean=e.target.value.replace(/\s/g,'');if(clean!==e.target.value)e.target.value=clean};u.addEventListener('input',stripWhitespace);p.addEventListener('input',stripWhitespace);
  const go=h('button',{},'Войти');
  const sw=h('a',{},'Нет аккаунта? Регистрация');
  sw.onclick=()=>{reg=!reg;go.textContent=reg?'Зарегистрироваться':'Войти';sw.textContent=reg?'Есть аккаунт? Вход':'Нет аккаунта? Регистрация'};
  go.onclick=async()=>{
    err.textContent='';
    try{
      const r=await api('/api/v1/auth/'+(reg?'register':'login'),{method:'POST',body:JSON.stringify({username:u.value.trim(),password:p.value.trim()})});
      if(!r.ok){
        const j=await r.json().catch(()=>({}));
        err.textContent=r.status===409?'Этот логин уже занят':r.status===401?'Неверный логин или пароль':r.status===429?'Слишком много попыток, попробуйте позже':j.message||'Ошибка '+r.status;
        return;
      }
      const d=await r.json();
      Object.assign(S,{token:d.token,refreshToken:d.refreshToken||null,userId:d.userId,username:d.username});
      saveSession();start();
    }catch{err.textContent='Нет связи с сервером'}
  };
  return h('div',{class:'auth'},h('h1',{},'olo'),err,u,p,go,sw);
}
function start(){S.msgs=[];S.chatId=null;S.peerId=null;S.pendingChatId=new URLSearchParams(location.search).get('chat');history.replaceState({oloView:'list'},'',location.pathname);connectWS();loadChats();show('list')}
async function logout(remote=true){
  if(remote&&S.token){const oldSession={server:S.server,token:S.token,refreshToken:S.refreshToken};if(window.oloDisablePush)await window.oloDisablePush(oldSession);await api('/api/v1/auth/logout',{method:'POST',body:JSON.stringify({refreshToken:S.refreshToken})}).catch(()=>{});}
  wsGen++;if(S.ws)S.ws.close();S.ws=null;
  Object.assign(S,{token:null,refreshToken:null,userId:null,chats:[],msgs:[],chatId:null,hasOlder:false,loadingOlder:false});
  localStorage.removeItem('olo.session');show('auth');
}

/* ---------- список чатов и поиск ---------- */
function localDayKey(date){return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`}
function formatChatTime(value){if(!value)return'';const date=new Date(value);if(Number.isNaN(date.getTime()))return'';return localDayKey(date)===localDayKey(new Date())?new Intl.DateTimeFormat([], {hour:'2-digit',minute:'2-digit'}).format(date):new Intl.DateTimeFormat([], {day:'2-digit',month:'2-digit',year:'numeric'}).format(date)}
function formatMessageDate(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return'';const now=new Date(),yesterday=new Date(now);yesterday.setDate(now.getDate()-1);if(localDayKey(date)===localDayKey(now))return'Сегодня';if(localDayKey(date)===localDayKey(yesterday))return'Вчера';return new Intl.DateTimeFormat([], {day:'numeric',month:'long',year:'numeric'}).format(date)}
function chatRow(c){
  const content=c.lastMessage||'Нет сообщений';
  const sender=c.lastMessageSenderId===S.userId?'Вы':c.lastMessageSenderId?(c.partnerDisplayName?.trim()?.slice(0,4)||c.partnerUsername?.trim()?.slice(0,4)||c.partnerName?.slice(0,4)||''):'';
  const preview=sender?`${sender}: ${content}`:content;
  return h('div',{class:'row',onclick:()=>openChat(c)},avatar(c.partnerAvatarUrl),h('div',{class:'t'},h('b',{},c.partnerName||'Чат'),h('span',{},preview)),h('div',{class:'chat-meta'},c.lastMessageAt?h('span',{class:'chat-time'},formatChatTime(c.lastMessageAt)):null,c.unreadCount>0?h('em',{},c.unreadCount>99?'99+':String(c.unreadCount)):null))
}
function userRow(u){return h('div',{class:'row',onclick:()=>openWithUser(u)},avatar(u.avatarUrl),h('div',{class:'t'},h('b',{},u.displayName||u.username),u.displayName?h('span',{},'@'+u.username):null))}
function renderChats(){
  const l=$('#list');if(!l||S.q)return;
  l.replaceChildren(...(S.chats.length?S.chats.map(chatRow):[h('div',{class:'empty'},'Чатов пока нет. Найдите человека по логину в поиске.')]));
}
async function loadChats(){
  try{
    const r=await api('/api/v1/chats?userId='+encodeURIComponent(S.userId));
    if(!r.ok){if(view==='list')$('#list')?.replaceChildren(h('div',{class:'empty'},'Не удалось загрузить чаты (HTTP '+r.status+')'));return}
    S.chats=await r.json();if(view==='list')renderChats();
    if(S.pendingChatId){const c=S.chats.find(x=>x.id===S.pendingChatId);if(c){S.pendingChatId=null;history.replaceState({},'',location.pathname);openChat(c)}}
  }catch{if(view==='list')$('#list')?.replaceChildren(h('div',{class:'empty'},'Не удалось связаться с сервером при загрузке чатов'))}
}
function bottomBar(active){
  const settings=h('button',{type:'button','aria-label':'Настройки',title:'Настройки',onclick:()=>{if(active!=='settings')navigate('profile')}},h('span',{class:'nav-icon','aria-hidden':'true'},'⚙'),h('span',{class:'nav-label'},'Настройки'));
  const search=h('button',{type:'button','aria-label':'Поиск и чаты',title:'Поиск и чаты',onclick:()=>{if(active==='list')return;if(view==='chat'){S.chatId=null;S.peerId=null;S.msgs=[]}navigate('list');loadChats()}},h('span',{class:'nav-icon','aria-hidden':'true'},'✎'),h('span',{class:'nav-label'},'Поиск и чаты'));
  return h('nav',{class:'bottom-bar','aria-label':'Основная навигация'},settings,search)
}
function listView(){
  S.q='';
  const out=h('div',{class:'list',id:'list'});
  const q=h('input',{placeholder:'Поиск пользователей',autocapitalize:'off'});
  let tm;
  q.oninput=()=>{
    S.q=q.value.trim();clearTimeout(tm);
    tm=setTimeout(async()=>{
      if(!S.q){renderChats();return}
      try{
        const r=await api('/api/v1/users/search?query='+encodeURIComponent(S.q));
        if(!r.ok){out.replaceChildren(h('div',{class:'empty'},'Не удалось выполнить поиск (HTTP '+r.status+')'));return}
        if(S.q){const us=(await r.json()).filter(x=>x.id!==S.userId);out.replaceChildren(...(us.length?us.map(userRow):[h('div',{class:'empty'},'Никого не нашли')]));}
      }catch{out.replaceChildren(h('div',{class:'empty'},'Не удалось связаться с сервером при поиске'))}
    },300);
  };
  setTimeout(renderChats);
  return h('div',{class:'col'},
    h('header',{class:'app-header'},h('b',{},'olo')),
    h('div',{id:'connection-status',class:'connection-status'}),h('div',{class:'pad'},q),out,bottomBar('list'));
}
function setTheme(theme){applyTheme(theme);const light=document.querySelector('.theme-options button:first-child'),dark=document.querySelector('.theme-options button:last-child');if(light)light.classList.toggle('active',appTheme==='light');if(dark)dark.classList.toggle('active',appTheme==='dark')}
function profileView(){
  const name=h('input',{placeholder:'Отображаемое имя',maxlength:'100'}),preview=h('div',{class:'profile-preview'},avatar(S.avatar));
  const err=h('div',{class:'err'}),file=h('input',{type:'file',accept:'image/jpeg,image/png,image/webp',class:'avatar-input'});let avatarUrl=S.avatar||null;
  const save=h('button',{},'Сохранить изменения');
  file.onchange=async()=>{const f=file.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){err.textContent='Выберите изображение';return}try{avatarUrl=await compressAvatar(f);preview.replaceChildren(avatar(avatarUrl));err.textContent=''}catch{err.textContent='Не удалось обработать фото'}};
  const choose=h('button',{onclick:()=>file.click()},'Выбрать фото из галереи');
  const clear=h('button',{onclick:()=>{avatarUrl=null;preview.replaceChildren(avatar(null));file.value=''}},'Убрать фото');
  const lightThemeButton=h('button',{type:'button',class:appTheme==='light'?'active':'',onclick:()=>setTheme('light')},'Светлая');
  const darkThemeButton=h('button',{type:'button',class:appTheme==='dark'?'active':'',onclick:()=>setTheme('dark')},'Тёмная');
  const themeSetting=h('div',{class:'theme-setting'},h('span',{class:'theme-label'},'ТЕМА'),h('div',{class:'theme-options'},lightThemeButton,darkThemeButton));
  const logoutButton=h('button',{class:'logout-button',onclick:()=>confirm('Вы действительно хотите выйти из аккаунта?')&&logout()},'Выйти из аккаунта');
  save.onclick=async()=>{err.textContent='';save.disabled=true;try{const r=await api('/api/v1/users/me?userId='+encodeURIComponent(S.userId),{method:'PUT',body:JSON.stringify({displayName:name.value.trim()||null,avatarUrl})});if(!r.ok)throw new Error('Не удалось сохранить профиль ('+r.status+')');const u=await r.json();S.avatar=u.avatarUrl||'';S.displayName=u.displayName||'';saveSession();await loadChats();history.back()}catch(e){err.textContent=e.message||'Не удалось сохранить профиль'}finally{save.disabled=false}};
  setTimeout(async()=>{try{const r=await api('/api/v1/users/me?userId='+encodeURIComponent(S.userId));if(r.ok){const u=await r.json();name.value=u.displayName||'';avatarUrl=u.avatarUrl||null;S.avatar=avatarUrl||'';preview.replaceChildren(avatar(avatarUrl))}else{err.textContent='Не удалось загрузить профиль (HTTP '+r.status+')'}}catch{err.textContent='Не удалось связаться с сервером при загрузке профиля'}},0);
  return h('div',{class:'col'},h('header',{class:'app-header'},h('b',{},'Настройки профиля')),h('div',{id:'connection-status',class:'connection-status'}),h('div',{class:'settings-content'},preview,h('div',{class:'settings-username'},'@'+(S.username||'')),name,file,choose,clear,themeSetting,err,save,h('div',{id:'settings-actions',class:'settings-actions'}),logoutButton),bottomBar('settings'));
}
function compressAvatar(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,512/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))};img.src=reader.result};reader.readAsDataURL(file)})}
function openChat(c){Object.assign(S,{chatId:c.id,peerId:null,partner:c.partnerName||'Чат',avatar:c.partnerAvatarUrl,msgs:[],hasOlder:false,loadingOlder:false});navigate('chat');loadMsgs()}
async function openWithUser(u){
  const r=await api('/api/v1/chats/direct/'+u.id);
  if(r.status===404){Object.assign(S,{chatId:null,peerId:u.id,partner:u.displayName||u.username,avatar:u.avatarUrl,msgs:[]});navigate('chat')}
  else if(r.ok)openChat(await r.json());
}

/* ---------- диалог ---------- */
const TICK={PENDING:'…',SENT:'✓',DELIVERED:'✓✓',READ:'✓✓',FAILED:'⚠ не отправлено'};
function msgEl(m){
  const me=m.senderId===S.userId,d=new Date(m.timestamp);
  return h('div',{class:'m'+(me?' me':'')},m.content,
    h('small',{},isNaN(d)?'':d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),me?h('i',{class:m.status==='READ'?'rd':''},' '+(TICK[m.status]||'')):null));
}
function renderMsgs(forceBottom=false){
  const l=$('#msgs');if(!l)return;
  const near=forceBottom||l.scrollHeight-l.scrollTop-l.clientHeight<80;
  S.msgs.sort((a,b)=>String(a.timestamp).localeCompare(String(b.timestamp)));
  const rows=[];let previousDay=null;
  for(const message of S.msgs){const date=new Date(message.timestamp);const day=Number.isNaN(date.getTime())?'unknown':localDayKey(date);if(day!==previousDay){rows.push(h('div',{class:'message-date'},formatMessageDate(message.timestamp)));previousDay=day}rows.push(msgEl(message))}
  const stack=h('div',{class:'message-stack'});stack.replaceChildren(...rows);l.replaceChildren(stack);
  if(near)l.scrollTop=l.scrollHeight;
}
function markRead(){
  if(view!=='chat'||document.hidden||!S.chatId||!S.msgs.some(m=>m.senderId!==S.userId&&m.status!=='READ'))return;
  S.msgs.forEach(m=>{if(m.senderId!==S.userId)m.status='READ'});
  api(`/api/v1/chats/${S.chatId}/read`,{method:'POST'}).then(loadChats).catch(()=>{});
}
async function loadMsgs(){
  if(!S.chatId)return;
  try{
    const r=await api(`/api/v1/chats/${S.chatId}/messages?limit=50`);if(!r.ok)return;
    const list=await r.json();S.hasOlder=list.length===50;
    const pend=S.msgs.filter(m=>m.status==='PENDING'||m.status==='FAILED');
    S.msgs=[...new Map([...S.msgs,...list,...pend].map(m=>[m.id,m])).values()].sort((a,b)=>String(a.timestamp).localeCompare(String(b.timestamp)));
    renderMsgs(true);markRead();
  }catch{}
}
async function loadOlderMessages(){
  if(!S.chatId||!S.hasOlder||S.loadingOlder)return;
  const first=S.msgs[0];if(!first)return;S.loadingOlder=true;
  const listEl=$('#msgs'),oldHeight=listEl?.scrollHeight||0,oldTop=listEl?.scrollTop||0;
  try{const r=await api(`/api/v1/chats/${S.chatId}/messages?limit=50&beforeMessageId=${encodeURIComponent(first.id)}`);if(!r.ok)return;const page=await r.json();S.hasOlder=page.length===50;S.msgs=[...new Map([...S.msgs,...page].map(m=>[m.id,m])).values()].sort((a,b)=>String(a.timestamp).localeCompare(String(b.timestamp)));renderMsgs();if(listEl)listEl.scrollTop=oldTop+(listEl.scrollHeight-oldHeight)}catch{}finally{S.loadingOlder=false}
}

async function send(text){
  const cid=crypto.randomUUID(),now=new Date().toISOString();
  S.msgs.push({id:cid,clientMessageId:cid,chatId:S.chatId,senderId:S.userId,content:text,status:'PENDING',timestamp:now});
  renderMsgs();
  const body=S.chatId?{senderId:S.userId,content:text,sentAt:now,clientMessageId:cid}:{targetUserId:S.peerId,content:text,sentAt:now,clientMessageId:cid};
  try{
    const r=await api(S.chatId?`/api/v1/chats/${S.chatId}/messages`:'/api/v1/chats/direct/messages',{method:'POST',body:JSON.stringify(body)});
    if(!r.ok)throw 0;
    const d=await r.json();
    S.chatId=d.chatId;S.peerId=null;
    S.msgs=S.msgs.filter(x=>x.id!==d.id&&x.clientMessageId!==cid);S.msgs.push(d);
  }catch{const m=S.msgs.find(x=>x.clientMessageId===cid);if(m)m.status='FAILED'}
  renderMsgs();loadChats();
}
function chatView(){
  const inp=h('textarea',{rows:'1',placeholder:'Сообщение'});
  const go=()=>{const t=inp.value.trim();if(t){inp.value='';send(t)}};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|iPhone|Android/.test(navigator.userAgent)){e.preventDefault();go()}};
  setTimeout(()=>{renderMsgs();const list=$('#msgs');if(list)list.onscroll=()=>{if(list.scrollTop<100)loadOlderMessages()};},0);
  return h('div',{class:'col'},
    h('header',{class:'chat-header'},h('b',{},'olo'),h('div',{class:'chat-header-person'},h('button',{class:'back','aria-label':'Назад',onclick:()=>history.back()},'‹'),avatar(S.avatar),h('b',{},S.partner))),
    h('div',{id:'connection-status',class:'connection-status'}),
    h('div',{class:'msgs',id:'msgs'}),
    h('footer',{},inp,h('button',{'aria-label':'Отправить',onclick:go},'Отправить')),bottomBar('chat'));
}

/* ---------- WebSocket ---------- */
function closeWS(){wsGen++;if(S.ws)S.ws.close();S.ws=null}
async function connectWS(){
  closeWS();if(!S.token)return;
  S.connectionStatus=S.retry?'RECONNECTING':'CONNECTING';S.connectionStatusVisible=true;updateConnectionStatus();
  const id=wsGen;
  try{
    const r=await api('/api/v1/ws-ticket',{method:'POST'});if(!r.ok)throw 0;
    const {ticket}=await r.json();if(id!==wsGen)return;
    const ws=new WebSocket(S.server.replace(/^http/,'ws')+'/ws?ticket='+encodeURIComponent(ticket));S.ws=ws;
    ws.onopen=()=>{S.retry=0;S.connectionStatus='CONNECTED';S.connectionStatusVisible=true;updateConnectionStatus();loadChats();loadMsgs();setTimeout(()=>{if(S.ws===ws&&S.connectionStatus==='CONNECTED'){S.connectionStatusVisible=false;updateConnectionStatus()}},2200)};
    ws.onmessage=e=>{try{onEvent(JSON.parse(e.data))}catch{}};
    ws.onerror=()=>{if(id===wsGen){S.connectionStatus='ERROR';updateConnectionStatus()}};
    ws.onclose=()=>{if(id===wsGen){S.connectionStatus='RECONNECTING';updateConnectionStatus();retry()}};
  }catch{if(id===wsGen){S.connectionStatus='ERROR';updateConnectionStatus();retry()}}
}
function retry(){S.connectionStatus='RECONNECTING';S.connectionStatusVisible=true;updateConnectionStatus();setTimeout(connectWS,Math.min(30000,1000*2**S.retry++))}
function updateConnectionStatus(){
  const el=$('#connection-status');if(!el)return;
  const states={CONNECTING:['Подключаемся к серверу…','reconnecting'],CONNECTED:['Подключено','connected'],RECONNECTING:['Связь прервалась, переподключаемся…','reconnecting'],ERROR:['Ошибка соединения','error'],DISCONNECTED:['Нет соединения','error']};
  const [label,style]=states[S.connectionStatus]||states.DISCONNECTED;el.textContent='●  '+label;el.className='connection-status '+style;el.hidden=S.connectionStatus==='CONNECTED'&&!S.connectionStatusVisible;
}
function onEvent(e){
  if(e.type==='NEW_MESSAGE'){
    if(!S.chatId&&S.peerId&&e.senderId===S.peerId){S.chatId=e.chatId;S.peerId=null}
    if(e.chatId===S.chatId&&view==='chat'&&!S.msgs.some(m=>m.id===e.id||(e.clientMessageId&&m.clientMessageId===e.clientMessageId))){
      S.msgs.push(e);renderMsgs();markRead();
    }
    loadChats();
  }else if(e.type==='MESSAGE_STATUS'&&e.chatId===S.chatId){
    const m=S.msgs.find(x=>x.id===e.id);if(m){m.status=e.status;renderMsgs()}
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!S.token)return;
  if(!S.ws||S.ws.readyState>1)connectWS();else{loadChats();loadMsgs()}
});
window.addEventListener('offline',()=>{S.connectionStatus='ERROR';updateConnectionStatus()});
window.addEventListener('online',()=>{if(S.token)connectWS()});

function updateViewportHeight(){if(window.visualViewport){document.documentElement.style.setProperty('--app-height',window.visualViewport.height+'px');document.body.classList.toggle('keyboard-open',window.visualViewport.height<window.innerHeight-140)}}
updateViewportHeight();window.visualViewport?.addEventListener('resize',updateViewportHeight);window.addEventListener('orientationchange',()=>setTimeout(updateViewportHeight,150));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('olo-open-chat',event=>{const id=event.detail.chatId,c=S.chats.find(x=>x.id===id);if(c)openChat(c);else{S.pendingChatId=id;loadChats()}});
if(S.token)start();else{history.replaceState({oloView:'auth'},'',location.href);show('auth')}
</script>
